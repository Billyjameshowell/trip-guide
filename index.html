<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Trip guide for Billy and Isabel — London and Dublin, September 2026." />
    <title>Trip Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,620;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#places">Skip to places</a>

    <header class="masthead">
      <div class="masthead__inner">
        <p class="eyebrow" id="travelers">Billy &amp; Isabel</p>
        <h1 id="site-title">Trip Guide</h1>
        <p class="lede" id="headline">London + Dublin notes · September 2026</p>
        <nav class="site-nav" aria-label="Site">
          <a href="index.html" aria-current="page">Trip Guide</a>
          <a href="itinerary.html">Itinerary</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="filters" aria-labelledby="filter-heading">
        <div class="filters__inner">
          <h2 id="filter-heading">Filter</h2>
          <div class="filter-block">
            <p class="filter-label" id="city-filter-label">City</p>
            <div class="chips" id="city-filters" role="group" aria-labelledby="city-filter-label"></div>
          </div>
          <div class="filter-block">
            <p class="filter-label" id="activity-filter-label">Activity</p>
            <div class="chips" id="activity-filters" role="group" aria-labelledby="activity-filter-label"></div>
          </div>
          <div class="filter-block filter-block--hidden">
            <div class="chips" id="device-filters" role="group" aria-label="Hidden places"></div>
          </div>
          <p class="result-count" id="result-count" aria-live="polite"></p>
        </div>
      </section>

      <section class="places" id="places" aria-live="polite">
        <p class="loading" id="loading">Loading places…</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>Tap a status to change it. Changes stay on this phone.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
